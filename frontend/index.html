<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniHack — AI Product Enrichment</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <div>
        <h1>Product Intelligence</h1>
        <p class="tagline">Raw catalogue &rarr; standardized, commerce-ready records</p>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#dashboard" data-view="dashboard" class="active">Dashboard</a>
      <a href="#upload" data-view="upload">Upload</a>
      <a href="#products" data-view="products">Products</a>
      <a href="#rag" data-view="rag">RAG Evidence</a>
      <a href="#review" data-view="review">Review <span class="badge" id="review-badge">0</span></a>
      <a href="#metrics" data-view="metrics">Metrics</a>
    </nav>
  </header>

  <main id="view" class="view">
    <div class="loading" id="loading">Loading data…</div>
  </main>

  <footer class="foot">
    <span>AI proposes · Evidence grounds · Controlled vocabularies constrain · Rules validate · Confidence flags · Humans decide</span>
  </footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- Production backend for the dashboard. Routing is environment-aware
       (see js/app.js):
         - dev  : opened from the local Flask server -> local API (this file's
                  value is ignored)
         - prod : hosted anywhere else (Render, GitHub Pages, file://) -> this
                  URL; backend sends CORS headers so cross-origin calls work -->
  <script>window.UNIHACK_BACKEND_URL = "https://ai-product-intelligence-6xfq.onrender.com";</script>

  <script src="js/app.js"></script>
</body>
</html>
